version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /ml_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: torch
      - dependency-name: torchaudio

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # CUDA must stay on 12.8 to match the cu128 torch/torchaudio wheels.
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
